<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Balai Penghargaan - ZATOPIA</title>
    <meta
      name="description"
      content="Balai Penghargaan ZATOPIA: badge penghargaan untuk penjelajah yang sudah menyelesaikan petualangan."
    />

    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌎</text></svg>"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/materi.css" />
    <link rel="stylesheet" href="../css/penghargaan.css" />
  </head>
  <body>
    <header class="navbar">
      <a
        class="navbar-logo"
        href="../index.html"
        aria-label="ZATOPIA, kembali ke Beranda"
        >🌎 ZATOPIA</a
      >

      <nav aria-label="Menu utama">
        <ul class="navbar-menu">
          <li><a href="../index.html">Beranda</a></li>
          <li><a href="../index.html#petunjuk">Petunjuk</a></li>
          <li>
            <a href="tentang.html" data-placeholder="Tentang ZATOPIA"
              >Tentang</a
            >
          </li>
        </ul>
      </nav>
    </header>

    <main
      class="halaman-materi"
      id="halaman-materi"
      data-tema="penghargaan"
      data-lokasi="balai-penghargaan"
      data-avatar="zaki"
    >
      <section class="hero hero-materi">
        <div class="hero-isi">
          <a class="tautan-peta" href="peta.html">← Peta ZATOPIA</a>

          <h1 class="judul-materi">🏆 SELAMAT, PENJELAJAH ZAT!</h1>

          <div class="teman">
            <div class="teman-avatar" data-karakter>
              <img id="avatar-teman" alt="" />
              <span class="emoji-karakter" id="emoji-teman" aria-hidden="true"
                >👦</span
              >
            </div>
            <div class="teman-bubble">
              <p class="teman-teks" id="teman-teks"></p>
            </div>
          </div>
        </div>

        <svg
          class="gelombang"
          viewBox="0 0 1440 80"
          preserveAspectRatio="none"
          aria-hidden="true"
          focusable="false"
        >
          <path
            d="M0,40 C240,90 480,0 720,30 C960,60 1200,90 1440,30 L1440,80 L0,80 Z"
            fill="#ffffff"
          />
        </svg>
      </section>

      <div class="materi-isi">
        <!-- ==================== KARTU BADGE ==================== -->
        <section class="bagian">
          <div class="kartu-badge">
            <p class="badge-nama" id="badge-nama">Penjelajah ZATOPIA</p>

            <div class="badge-lingkaran" id="badge-lingkaran">
              <span class="badge-emoji" id="badge-emoji">🥉</span>
            </div>

            <p class="badge-gelar" id="badge-gelar">Penjelajah Pemula</p>
            <p class="badge-skor" id="badge-skor">Skor: 0 / 100</p>

            <p class="badge-motivasi" id="badge-motivasi"></p>
          </div>
        </section>

        <!-- ==================== AKSI ==================== -->
        <nav
          class="navigasi-materi navigasi-badge"
          aria-label="Navigasi Balai Penghargaan"
        >
          <button type="button" class="tombol tombol-garis" id="tombol-ulangi">
            🔄 Ulangi Petualangan
          </button>
          <a class="tombol tombol-garis" href="peta.html">🗺️ Kembali ke Peta</a>
          <a class="tombol tombol-utama" href="../index.html">🏠 Beranda</a>
        </nav>
      </div>
    </main>

    <footer class="footer">
      <p><strong>ZATOPIA</strong> - Petualangan Dunia Zat</p>
      <p>IPAS Kelas IV SD, materi Wujud, Zat, dan Perubahannya</p>
    </footer>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="../js/main.js"></script>
    <script src="../js/storage.js"></script>
    <script src="../js/penghargaan.js"></script>
  </body>
</html>
